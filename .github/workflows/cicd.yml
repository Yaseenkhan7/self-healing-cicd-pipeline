name: Self‑Healing CI/CD Pipeline (EC2 Deploy)
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        required: false
        default: staging
env:
  DEPLOYMENT_VERSION: ${{ github.sha }}
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          set -euo pipefail
          curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec (IaC scan) and save JSON report
        run: |
          set -euo pipefail
          # Run tfsec and always produce JSON output even if tfsec exits non-zero
          tfsec infra/terraform --format json --out tfsec-report.json || true
          # Summarize and count HIGH + CRITICAL findings
          COUNT=$(jq '[.results[] | select(.severity=="CRITICAL" or .severity=="HIGH")] | length' tfsec-report.json)
          echo "tfsec high+critical count: $COUNT"
          # Upload report for review (artifact upload step below will handle it)
          echo "TFSEC_COUNT=$COUNT" >> $GITHUB_OUTPUT

      - name: Upload tfsec JSON report
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-report
          path: tfsec-report.json

      - name: Fail job on HIGH/CRITICAL tfsec findings
        run: |
          set -euo pipefail
          # read count if available from previous step output or the report
          if [ -n "${{ steps.upload-tfsec-report.outcome || '' }}" ]; then
            :
          fi
          COUNT=$(jq '[.results[] | select(.severity=="CRITICAL" or .severity=="HIGH")] | length' tfsec-report.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "tfsec found HIGH/CRITICAL issues ($COUNT). Failing the job."
            jq '.results[] | select(.severity=="CRITICAL" or .severity=="HIGH") | {rule_id:.rule_id,severity:.severity,summary:.summary,location:.location}' tfsec-report.json
            exit 1
          fi

      - name: Run trivy on Dockerfile (optional IaC/app check)
        uses: aquasecurity/trivy-action@v0.12.0
        with:
          scan-type: fs
          dir: ./app

  build_and_push:
    runs-on: ubuntu-latest
    needs: security
    permissions:
      id-token: write
      contents: read
    outputs:
      IMAGE_TAG: ${{ steps.build.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}

      - name: Build image
        id: build
        run: |
          set -euo pipefail
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE=${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}
          docker build -t "$IMAGE" ./app
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.12.0
        with:
          image: ${{ secrets.ECR_REPOSITORY }}:${{ steps.build.outputs.IMAGE_TAG }}
          format: table

      - name: Push image
        run: |
          set -euo pipefail
          IMAGE_TAG=${{ steps.build.outputs.IMAGE_TAG }}
          IMAGE=${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}
          docker push "$IMAGE"

      - name: Upload scripts to S3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.SCRIPTS_S3_BUCKET }}" ]; then
            echo "SCRIPTS_S3_BUCKET secret is not set"
            exit 1
          fi
          aws s3 cp scripts/ s3://${{ secrets.SCRIPTS_S3_BUCKET }}/ --recursive --region $AWS_REGION

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deploy variables
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.build_and_push.outputs.IMAGE_TAG }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Discover instance ids
        id: instances
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          KEY=$(echo "${{ vars.EC2_TARGET_TAG }}" | cut -d'=' -f1)
          VALUE=$(echo "${{ vars.EC2_TARGET_TAG }}" | cut -d'=' -f2)
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:${KEY},Values=${VALUE}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text --region $AWS_REGION || true)
          echo "INSTANCE_IDS=$INSTANCE_IDS" >> $GITHUB_OUTPUT

      - name: Send SSM deploy
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.build_and_push.outputs.IMAGE_TAG }}"
          INSTANCE_IDS="${{ steps.instances.outputs.INSTANCE_IDS }}"
          if [ -z "$INSTANCE_IDS" ]; then
            echo "No target instances found for tag ${{ vars.EC2_TARGET_TAG }}"
            exit 1
          fi
          COMMAND="aws s3 cp s3://${{ secrets.SCRIPTS_S3_BUCKET }}/deploy_on_instance.sh /tmp/deploy_on_instance.sh && chmod +x /tmp/deploy_on_instance.sh && ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }} IMAGE_TAG=${IMAGE_TAG} AWS_REGION=${AWS_REGION} ENVIRONMENT=${{ github.event.inputs.environment || 'staging' }} /bin/bash /tmp/deploy_on_instance.sh"
          aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters commands=["/bin/bash -c '$COMMAND'"] \
            --timeout-seconds 1200 --region $AWS_REGION > ssm-deploy.json || true

      - name: Upload deploy response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-ssm-response
          path: ssm-deploy.json

  health_check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke test
        env:
          ALB_DNS: ${{ secrets.ALB_DNS_NAME }}
        run: |
          set -euo pipefail
          if [ -z "$ALB_DNS" ]; then
            echo "ALB_DNS_NAME secret is not set"
            exit 1
          fi
          ./scripts/smoke_test.sh

  notify:
    runs-on: ubuntu-latest
    needs: health_check
    if: always()
    steps:
      - name: Notify
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "${SLACK_WEBHOOK}" ]; then
            echo "No Slack webhook configured, skipping notification"
            exit 0
          fi
          MESSAGE=":information_source: Pipeline run ${{ github.run_number }} completed."
          curl -s -X POST -H 'Content-type: application/json' --data "{\"text\": \"${MESSAGE}\"}" "${SLACK_WEBHOOK}" || true
