name: Self-Healing CI/CD Pipeline (EC2 Deploy)
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        required: false
        default: staging
env:
  DEPLOYMENT_VERSION: ${{ github.sha }}
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tfsec
        uses: aelsabbahy/tfsec-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run trivy on Dockerfile
        uses: aquasecurity/trivy-action@v0.12.0
        with:
          scan-type: fs
          dir: ./app
  build_and_push:
    runs-on: ubuntu-latest
    needs: security
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}
      - name: Build image
        id: build
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE=${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}
          docker build -t "$IMAGE" ./app
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.12.0
        with:
          image: ${{ secrets.ECR_REPOSITORY }}:${GITHUB_SHA::7}
      - name: Push image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE=${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}
          docker push "$IMAGE"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
      - name: Upload scripts to S3
        run: |
          if [ -z "${{ secrets.SCRIPTS_S3_BUCKET }}" ]; then
            exit 1
          fi
          aws s3 cp scripts/ s3://${{ secrets.SCRIPTS_S3_BUCKET }}/ --recursive --region ${{ secrets.AWS_REGION }}
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deploy variables
        run: |
          IMAGE_TAG=${{ steps.build.outputs.IMAGE_TAG }}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
      - name: Discover instance ids
        run: |
          KEY=$(echo "${{ vars.EC2_TARGET_TAG }}" | cut -d'=' -f1)
          VALUE=$(echo "${{ vars.EC2_TARGET_TAG }}" | cut -d'=' -f2)
          INSTANCE_IDS=$(aws ec2 describe-instances --filters "Name=tag:$KEY,Values=$VALUE" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output text --region ${{ secrets.AWS_REGION }})
          echo "INSTANCE_IDS=$INSTANCE_IDS" >> $GITHUB_OUTPUT
      - name: Send SSM deploy
        run: |
          IMAGE_TAG=${{ steps.build.outputs.IMAGE_TAG }}
          INSTANCE_IDS="${{ steps.instances.outputs.INSTANCE_IDS }}"
          if [ -z "$INSTANCE_IDS" ]; then
            exit 1
          fi
          COMMAND="aws s3 cp s3://${{ secrets.SCRIPTS_S3_BUCKET }}/deploy_on_instance.sh /tmp/deploy_on_instance.sh && chmod +x /tmp/deploy_on_instance.sh && ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }} IMAGE_TAG=${IMAGE_TAG} AWS_REGION=${{ secrets.AWS_REGION }} ENVIRONMENT=${{ inputs.environment }} /bin/bash /tmp/deploy_on_instance.sh"
          aws ssm send-command --instance-ids $INSTANCE_IDS --document-name "AWS-RunShellScript" --comment "Deploy ${IMAGE_TAG}" --parameters commands=["/bin/bash -c '$COMMAND'"] --timeout-seconds 1200 --region ${{ secrets.AWS_REGION }} > ssm-deploy.json
      - name: Upload deploy response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-ssm-response
          path: ssm-deploy.json
  health_check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Run smoke test
        run: |
          ALB_DNS=${{ secrets.ALB_DNS_NAME }}
          ./scripts/smoke_test.sh
  notify:
    runs-on: ubuntu-latest
    needs: health_check
    if: always()
    steps:
      - name: Notify
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK }}" ]; then
            exit 0
          fi
          MESSAGE="Pipeline run ${{ github.run_number }} completed."
          curl -s -X POST -H 'Content-type: application/json' --data "{\"text\": \"${MESSAGE}\"}" "${{ secrets.SLACK_WEBHOOK }}" || true
